[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeforge-trading-platform"
version = "0.1.0"
description = "Safe, auditable, paper-first personal quantitative trading platform"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]

[project.scripts]
tradeforge-safety-test = "tradeforge.safety_suite:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
